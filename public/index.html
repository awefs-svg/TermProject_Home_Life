<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="style.css"> 
    <meta charset="UTF-8">
    <title>Home Life</title>
</head>

<body>
    <header> 
        <h1>어서와, 우리집!</h1>
        <p>보유 코인 : 100 G</p>
    </header>
    <main>
        <!--집 내부 화면-->
        <section id ="inside">
            <h2>My Home</h2>
            <div class="game-area">
                <!-- 벽면 장식 배치 영역 -->
                <div id="wall-grid"></div>

                <!-- 바닥 기구 배치 영역 -->
                <div id="house-grid"></div>
            </div>
        </section>
        
        <section id ="outside">
            <h2>나의 마당</h2>
            <div class="garden-area">
                <!-- 마당 자유 배치 영역 -->
                <div id="garden-grid"></div>

            </div>
        </section>
    </main>

    <!-- 하단 메뉴 -->
    <nav>
        <button onclick="showInside()">집 내부</button>
        <button onclick="showOutside()">마당</button>
        <button>상점</button>
        <button>인벤토리</button>
    </nav>
    <script src = "app.js"></script>
</body>
</html>
