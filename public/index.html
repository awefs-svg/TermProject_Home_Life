<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="style.css"> 
    <meta charset="UTF-8">
    <title>Home Life</title>
</head>

<body>
    <header> 
        <h1>어서와, 우리집!</h1>
        <p>보유 코인 : 100 G</p>
    </header>
    <main>
        <section id ="inside">
            <h2>나의 집</h2>
            <p>이곳은 집 내부 화면입니다.</p>
            <p>침대, 소파, 테이블 등 배치할 예정입니다.</p>
        </section>
        
        <section id ="outside">
            <h2>나의 마당</h2>
            <p>이곳은 집 밖 마당입니다.</p>
            <p>농작물을 키우고 울타리를 설치하며 밭을 꾸려나갈 예정입니다.</p>
        </section>
    </main>

    <nav>
        <button onclick="showInside()">집 내부</button>
        <button onclick="showOutside()">마당</button>
        <button>상점</button>
        <button>인벤토리</button>
    </nav>
    <script src = "app.js"></script>
</body>
</html>
